# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: tests

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        # oldest supported, 3.10, current, and the free-threaded build (also guards against dependencies
        # without cp314t wheels, e.g. pywin32 on Windows)
        python-version: ["3.8", "3.10", "3.12", "3.14t"]

    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # - name: Get cache key for current week and OS
      #   id: cachekey
      #   run: |
      #     echo "cache_key=${{ runner.os }}-${{ matrix.python-version }}-$(date +'%Y-%V')" >> $GITHUB_OUTPUT

      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-name: tests
      
      - name: Install dependencies
        run: |
          pip install pytest

      - name: Install package
        run: |
          pip install -e .

      - name: Check interpreter
        run: |
          python -c "import sys; print(sys.version); ft = '${{ matrix.python-version }}'.endswith('t'); assert ft == (not getattr(sys, '_is_gil_enabled', lambda: True)()), 'wrong interpreter build'"

      # this runs the platform-specific tests declared in tox.ini
      - name: Snapshot OS objects (shared memory, semaphores, lock files)
        if: runner.os != 'Windows'
        run: python tests/check_leftovers.py snapshot "$RUNNER_TEMP/os_objects_before.txt"

      - name: Test with pytest
        run: |
          pytest -vv -s
        env:
          PLATFORM: ${{ matrix.platform }}

      # after pytest has exited, so that cleanup at interpreter exit is included (Windows: objects disappear
      # with the processes holding them; tests/test_teardown.py checks that per object on all platforms)
      - name: Check for OS objects left behind by the tests
        if: runner.os != 'Windows'
        run: python tests/check_leftovers.py compare "$RUNNER_TEMP/os_objects_before.txt"
